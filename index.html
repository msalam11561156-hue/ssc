    <script>
      (function() {
        window.__vite_plugin_react_preamble_installed__ = true;
        window.$RefreshReg$ = window.$RefreshReg$ || function() {};
        window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };

        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var str = String(msg || '') + ' ' + String(url || '') + ' ' + (error ? String(error.message || error.stack || '') : '');
          if (str.indexOf('send') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('hmr') !== -1) {
            return true;
          }
        };

        window.addEventListener('error', function(e) {
          var str = String(e && e.message ? e.message : '') + ' ' + (e && e.error && e.error.message ? String(e.error.message) : '');
          if (str.indexOf('send') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('hmr') !== -1) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var str = String(e && e.reason ? (e.reason.message || e.reason) : '');
          if (str.indexOf('send') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('hmr') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        });

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              var text = typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack) ? (arg.message || arg.stack) : String(arg));
              if (text.indexOf('WebSocket') !== -1 || text.indexOf('vite-hmr') !== -1 || text.indexOf('send') !== -1 || text.indexOf('@vite/client') !== -1) {
                return;
              }
            }
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              var text = typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack) ? (arg.message || arg.stack) : String(arg));
              if (text.indexOf('WebSocket') !== -1 || text.indexOf('vite-hmr') !== -1 || text.indexOf('send') !== -1) {
                return;
              }
            }
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>
